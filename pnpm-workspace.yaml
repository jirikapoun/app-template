packages:
- 'apps/*'
- 'libs/*'
- 'packages/*'
preferWorkspacePackages: true
linkWorkspacePackages: deep
allowBuilds:
  esbuild: true
  unrs-resolver: true
patchedDependencies:
  '@asteasolutions/zod-to-openapi': patches/@asteasolutions__zod-to-openapi.patch
  '@hono/zod-openapi': patches/@hono__zod-openapi.patch
  '@strv/eslint-config-base': patches/@strv__eslint-config-base.patch
  '@strv/eslint-config-mocha': patches/@strv__eslint-config-mocha.patch
  '@strv/eslint-config-node': patches/@strv__eslint-config-node.patch
  '@strv/eslint-config-typescript': patches/@strv__eslint-config-typescript.patch
  eslint-plugin-consistent-default-export-name: patches/eslint-plugin-consistent-default-export-name.patch
  eslint-plugin-import: patches/eslint-plugin-import.patch
  eslint-plugin-modules-newline: patches/eslint-plugin-modules-newline.patch
